name: Validate Marketplace

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # AgentForge is no longer installed here. The compiler is pinned by version
      # + per-platform sha256 in `scripts/marketplace/generation.py`, which fetches
      # and verifies it on first use and caches it under `.cache/agentforge/`.
      # One pin, one code path, identical bytes in CI and on a laptop.

      - name: Install Claude Code validator
        run: npm install --global @anthropic-ai/claude-code@2.1.216

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'

      - name: Check Claude and Codex marketplaces (sync drift + schemas + lint + privacy gate)
        run: uv run marketplace check

      - name: Unit tests
        run: uv run pytest -q

      # The publications are committed, so the merge gate validates the exact
      # bytes both runtimes will load rather than a fresh temporary compile.
      - name: Validate committed publications
        run: |
          "$(uv run marketplace agentforge-path)" \
            check MARKETPLACE.yaml --out marketplaces --claude-native
