name: Validate Marketplace

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      AGENTFORGE_PROJECT: ${{ github.workspace }}/agentforge

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout pinned AgentForge compiler
        uses: actions/checkout@v4
        with:
          repository: jdh313/agentforge
          ref: 1dba647fe872ef6422132cee82e03fb386f82eb8
          path: agentforge
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install pinned AgentForge dependencies
        working-directory: agentforge
        run: bun install --frozen-lockfile

      - name: Install Claude Code validator
        run: npm install --global @anthropic-ai/claude-code@2.1.216

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'

      - name: Check Claude and Codex marketplaces (sync drift + schemas + lint + privacy gate)
        run: uv run marketplace check

      - name: Unit tests
        run: uv run pytest -q

      # The publications are committed, so the merge gate validates the exact
      # bytes both runtimes will load rather than a fresh temporary compile.
      - name: Validate committed publications
        run: bun run "$AGENTFORGE_PROJECT/src/cli.ts" check MARKETPLACE.yaml --out marketplaces --claude-native
