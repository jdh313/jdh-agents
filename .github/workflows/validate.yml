name: Validate Marketplace

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      AGENTFORGE_VERSION: 0.2.0
      AGENTFORGE_SHA256: 47f06c4f1baf7bed04e137ab6c2ca1a4fbab10a7c6f93a34db74f4e94d8c337b

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pinned AgentForge
        run: |
          curl -fsSLO "https://github.com/jdh313/agentforge/releases/download/v${AGENTFORGE_VERSION}/agentforge-linux-x64"
          echo "${AGENTFORGE_SHA256}  agentforge-linux-x64" | sha256sum -c
          chmod +x agentforge-linux-x64
          mkdir -p "$HOME/.local/bin" && mv agentforge-linux-x64 "$HOME/.local/bin/agentforge"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Claude Code validator
        run: npm install --global @anthropic-ai/claude-code@2.1.216

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'

      - name: Check Claude and Codex marketplaces (sync drift + schemas + lint + privacy gate)
        run: uv run marketplace check

      - name: Unit tests
        run: uv run pytest -q

      # The publications are committed, so the merge gate validates the exact
      # bytes both runtimes will load rather than a fresh temporary compile.
      - name: Validate committed publications
        run: agentforge check MARKETPLACE.yaml --out marketplaces --claude-native
