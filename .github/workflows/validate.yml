name: Validate Marketplace

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      # The privacy gate scans committed history, so it needs the commits.
      # actions/checkout defaults to depth 1, which would leave it scanning a
      # single commit and reporting clean no matter what earlier ones contain.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # On the Forgejo runner, job steps run under umask 0000 -- a dind default
      # with no upstream fix yet; the job image itself uses 0022 -- so checkout
      # writes 0666/0777, and `agentforge check` rejects managed outputs that
      # are not 0644/0755. A no-op on GitHub-hosted runners (umask 022).
      - name: Normalize checkout permissions
        run: chmod -R go-w .

      # AgentForge is not installed here. The compiler is pinned by version +
      # per-platform sha256 in `scripts/agentforge.sh`, which fetches and
      # verifies it on first use and caches it under `.cache/agentforge/`.
      # One pin, one code path, identical bytes in CI and on a laptop.

      - name: Install Claude Code validator
        run: npm install --global @anthropic-ai/claude-code@2.1.289

      # AgentForge only ever sees files a publication declares, so a leak in an
      # undeclared file is invisible to it. This is the repo-wide backstop for
      # the prek pre-push hook, and runs first so a leak fails fast.
      #
      # The self-test runs BEFORE the gate on purpose: the gate's worst failure
      # is silence, and a scan that matches nothing looks identical to a clean
      # tree. The self-test plants known violations and requires rejection, so a
      # silently-inert config fails here rather than passing forever.
      - name: Privacy gate self-test (planted violations must be rejected)
        run: scripts/tests/test_privacy_gate.sh

      - name: Privacy gate (machine paths, secrets, PII)
        run: scripts/privacy-scan.sh

      # The publications are committed, so the merge gate validates the exact
      # bytes both runtimes will load rather than a fresh temporary compile.
      # `check` covers output drift, managed-output content, manifest parity,
      # plugin path resolution, and skill frontmatter; `--claude-native`
      # cross-checks the Claude publication with `claude plugin validate --strict`.
      - name: Check committed publications (drift + schemas + native validation)
        run: |
          scripts/agentforge.sh check MARKETPLACE.yaml \
            --out marketplaces --claude-native

      # `check` reads files; these tests run the plugin code. `uv` is here
      # solely to resolve each test script's PEP 723 header -- the repo
      # declares no project and needs none.
      - name: Install uv (for the PEP 723 test scripts)
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Behavioral tests (introspect transcript attribution)
        run: uv run scripts/tests/test_introspect_usage_report.py

      - name: Behavioral tests (Langfuse dual-runtime parser)
        run: uv run scripts/tests/test_langfuse_hook.py
