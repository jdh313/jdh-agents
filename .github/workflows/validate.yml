name: Validate Marketplace

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      AGENTFORGE_PROJECT: ${{ github.workspace }}/agentforge

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Require AgentForge deploy key
        env:
          AGENTFORGE_DEPLOY_KEY: ${{ secrets.AGENTFORGE_DEPLOY_KEY }}
        run: |
          if [ -z "$AGENTFORGE_DEPLOY_KEY" ]; then
            echo "AGENTFORGE_DEPLOY_KEY is required for the full-corpus acceptance gate." >&2
            exit 1
          fi

      - name: Checkout pinned AgentForge compiler
        uses: actions/checkout@v4
        with:
          repository: jdh313/agentforge
          ref: 949898ac535a4863f87fdd69496377a25d6994fe
          path: agentforge
          ssh-key: ${{ secrets.AGENTFORGE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install pinned AgentForge dependencies
        working-directory: agentforge
        run: bun install --frozen-lockfile

      - name: Install Claude Code validator
        run: npm install --global @anthropic-ai/claude-code@2.1.216

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'

      - name: Check Claude and Codex marketplaces (sync drift + schemas + lint)
        run: uv run marketplace check

      - name: Unit tests
        run: uv run pytest -q

      - name: Validate generated native publications
        run: |
          generated_root="$RUNNER_TEMP/cc-marketplace-agentforge"
          bun run "$AGENTFORGE_PROJECT/src/cli.ts" compile MARKETPLACE.yaml --out "$generated_root"
          bun run "$AGENTFORGE_PROJECT/src/cli.ts" check MARKETPLACE.yaml --out "$generated_root" --claude-native
          uv run marketplace validate \
            --format codex \
            --manifest "$generated_root/codex/.agents/plugins/marketplace.json" \
            --plugins-root "$generated_root/codex/plugins"
