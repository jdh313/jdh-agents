name: Export Public Marketplace

# One-way export of the allowlisted plugin subset (export/public.json) to the
# public marketplace repo. The private repo is the source of truth; the public
# repo is a derived artifact (append-only, never committed to directly).
#
# Requires repo secret EXPORT_DEPLOY_KEY: the PRIVATE half of an SSH deploy key
# whose PUBLIC half is installed with write access on jdh313/shared-claude-plugins.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # What ships is the compiled Claude publication, so the trigger follows
      # the compiler output. An edit under plugins/ that has not been synced
      # fails the drift gate in validate.yml rather than publishing stale bytes.
      - 'marketplaces/claude/**'
      - 'export/**'
      - 'scripts/marketplace/**'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout jdh-agents (source of truth)
        uses: actions/checkout@v4

      - name: Checkout public target (shared-claude-plugins)
        uses: actions/checkout@v4
        with:
          repository: jdh313/shared-claude-plugins
          ssh-key: ${{ secrets.EXPORT_DEPLOY_KEY }}
          path: _public
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'

      - name: Configure export commit identity
        run: |
          git -C _public config user.name "jdh-agents-export[bot]"
          git -C _public config user.email "export@users.noreply.github.com"
          git -C _public config commit.gpgsign false

      - name: Export allowlisted plugins (privacy gate + validate run in-job)
        env:
          PUBLIC_REPO_DIR: ${{ github.workspace }}/_public
        run: uv run marketplace export --commit --push
