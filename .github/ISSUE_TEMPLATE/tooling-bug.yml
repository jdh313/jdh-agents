name: Marketplace tooling bug
description: "`agentforge compile`/`check` or the privacy scan misbehaves."
labels: [bug, tooling]
body:
  - type: dropdown
    id: command
    attributes:
      label: Command
      options:
        - agentforge compile
        - agentforge check
        - agentforge check --claude-native
        - privacy_scan.py
        - other
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Command and output
      description: The full invocation and its output. Redact any absolute home paths.
      render: shell
    validations:
      required: true

  - type: input
    id: agentforge
    attributes:
      label: AgentForge revision
      description: "`git -C <checkout> rev-parse HEAD`, or \"not used\" for read-only commands."
      placeholder: not used
    validations:
      required: true

  - type: checkboxes
    id: pinned
    attributes:
      label: Before filing
      options:
        - label: If this involved `sync` or `check`, I used a checkout pinned to the recorded SHA — not an `agentforge` binary on my PATH.
          required: true
