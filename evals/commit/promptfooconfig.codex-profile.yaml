description: compiled commit plugin evaluation for Codex app-server with a scoped permission profile
prompts: file://prompt.txt
extensions:
  - file://scripts/fixture-hook.js:beforeEach
# working_dir comes from the beforeEach hook: one fresh fixture per row.
providers:
  - id: openai:codex-app-server
    label: codex-plugin
    config:
      # Promptfoo 0.123.1 does not yet expose this experimental app-server
      # field. scripts/run.sh applies a version-guarded local adapter first.
      permissions: '{{env.COMMIT_EVAL_CODEX_PROFILE}}'
      approval_policy: never
      include_raw_events: true
      experimental_raw_events: true
      experimental_api: true
      reuse_server: false
      turn_timeout_ms: 120000
      cli_env:
        CODEX_HOME: '{{env.COMMIT_EVAL_CODEX_HOME}}'
evaluateOptions:
  maxConcurrency: 1
tests:
  - file://tests/shared-case.yaml
  - file://tests/jj-case.yaml
