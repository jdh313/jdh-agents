schema: agentforge.package/v1
id: feedback
defaults: {"name": "feedback", "version": "0.5.1", "description": "A two-sided loop for improving agent plugins from test sessions. The 'session' skill (tester side) turns the current session record into a copy-pasteable report grading the plugins exercised; the 'jot' skill files a quick note or idea about a single surface mid-session; the 'triage' skill (author side) aggregates many reports and jots into a prioritized action plan, routing each finding to a concrete fix. All three share one report-format contract.", "author": {"name": "Jacob Hoehler"}, "license": "Apache-2.0", "keywords": ["feedback", "testing", "dogfooding", "session-review", "triage", "plugins", "jot", "ideas"]}
artifacts:
  - {type: skill, pattern: 'skills/*/SKILL.md'}
payloads:
  include:
    - {source: references/}
targets:
  claude:
    native:
      userConfig:
        jot_dir: {type: directory, title: Jot folder, description: 'Absolute path of the folder jot files are written to on this machine; unset writes to .docs/feedback/jots/ in the current repo'}
  codex:
    losses:
      - construct: body-template-variable
        state: retained-unenforced
        note: The jot skill body interpolates ${user_config.jot_dir} to find its destination folder. Codex has no userConfig and emits the literal text unexpanded, so the skill's own placeholder check routes every Codex jot to .docs/feedback/jots/ in the current repo.
    native:
      interface:
        displayName: Feedback
        shortDescription: Grade plugin surfaces from a test session
        longDescription: Tester-side session reports grading the plugin surfaces exercised, quick jots about a single surface, and author-side triage that clusters reports and jots into a routed action plan.
        developerName: Jacob Hoehler
        category: Developer Tools
        capabilities: [Read, Write, Interactive]
        defaultPrompt: [Write up testing feedback for this session.]
