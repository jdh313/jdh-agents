schema: agentforge.package/v1
id: provenance
defaults: {"name":"provenance","version":"0.2.0","description":"Marketplace upkeep for borrowed work. Keeps adapted skills honest against their upstream sources: compares an adapted skill to its pinned upstream, flags behavioral drift and fabricated attributions, and refreshes the reviewed commit SHA. Houses upstream-review.","author":{"name":"Jacob Hoehler"},"license":"Apache-2.0","keywords":["provenance","upstream","adaptation","drift","maintenance","attribution"]}
artifacts:
  - {type: skill, pattern: 'skills/*/SKILL.md'}
  - {type: agent, pattern: 'agents/*.md'}
targets:
  claude:
    native:
      defaultEnabled: false
