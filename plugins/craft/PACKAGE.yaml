schema: agentforge.package/v1
id: craft
defaults: {"name": "craft", "version": "0.10.0", "description": "Software craftsmanship discipline skills: grill (the interview primitive — walk a decision tree one question at a time, facts looked up rather than asked, no acting until shared understanding), grill-with-docs (that loop applied to vocabulary, against per-repo CONTEXT.md glossaries), diagnose, prototype, tdd, improve-codebase-architecture, grok (stateful multi-session codebase comprehension with supersession-aware understanding records), zoom-out (adapted in part from mattpocock/skills, MIT), infra-review (architecture/security review of Terraform+Atlantis PRs), quiz-me (opt-in active-recall comprehension check after a code explanation), interrogate-model (holistic representability review of a domain model — the legitimate scenarios and personas it cannot express), and design-by-stories (design an artifact's shape — schema, template, data model, config — by modeling its actors and user stories first, then deriving the shape from the stories). Composes with spec-flow and ndr plugins.", "author": {"name": "Jacob Hoehler"}, "license": "Apache-2.0", "keywords": ["engineering", "craft", "discipline", "vocabulary", "context", "glossary", "comprehension", "onboarding", "terraform", "infrastructure", "review", "learning", "comprehension", "design", "modeling", "grill", "interview"]}
artifacts:
  - {type: skill, pattern: 'skills/*/SKILL.md'}
payloads:
  include:
    - {source: CONTEXT.md}
    - {source: RUNTIME.md}
    - source: skills/
      exclude: ['skills/*/SKILL.md', 'skills/*/scripts/**', 'skills/*/references/**', 'skills/*/assets/**']
targets:
  claude: {}
  codex:
    native:
      interface:
        displayName: Craft
        shortDescription: Apply disciplined engineering workflows
        longDescription: Reusable software craftsmanship workflows for design, diagnosis, testing, review, and comprehension.
        developerName: Jacob Hoehler
        category: Developer Tools
        capabilities: [Read, Write, Interactive]
        defaultPrompt: [Diagnose this failure systematically.]
