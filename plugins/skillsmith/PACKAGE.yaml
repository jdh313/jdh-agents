schema: agentforge.package/v1
id: skillsmith
defaults: {"name": "skillsmith", "version": "2.3.0", "description": "Craft and upkeep of skills. Authoring reference (the vocabulary and principles that make any agent-consumed document predictable — a skill, an AGENTS.md/CLAUDE.md, a rules file, a doc reached by a pointer) plus provenance tracking for borrowed work: compares an adapted skill to its pinned upstream, flags behavioral drift and fabricated attributions, and refreshes the reviewed commit SHA. Houses writing-for-agents and upstream-review.", "author": {"name": "Jacob Hoehler"}, "license": "Apache-2.0", "keywords": ["skills", "authoring", "skill-craft", "provenance", "upstream", "drift", "attribution"]}
artifacts:
  - {type: skill, pattern: 'skills/*/SKILL.md'}
  - {type: agent, pattern: 'agents/*.md'}
authoring-keys: [upstream]
payloads:
  include:
    - {source: RUNTIME.md}
targets:
  claude:
    native:
      defaultEnabled: false
  codex:
    codex-agent-bundle: true
    losses:
      - construct: body-agent-reference
        state: retained-unenforced
        note: >-
          Explicit setup can register exactly skillsmith:upstream-reviewer in
          one selected Codex scope. A fresh selected-scope check is required
          immediately before each exact dispatch. Generic body references are
          not mechanically guarded by the compiler, and plugin installation
          alone does not register the role; callers use a separately selected
          installed Markdown/procedure fallback without agent_type when
          registration is absent or stale.
      - construct: agent-tools-filter
        state: stripped
        note: The upstream-reviewer agent's read-only allowlist (Read, Grep, Glob, Bash(gh api *), Bash(base64 *)) is not enforceable on a Codex role procedure, which carries no tool allowlist; the read-only boundary is unenforced there.
    native:
      interface:
        displayName: Skillsmith
        shortDescription: Craft and audit skills
        longDescription: Authoring reference for writing predictable agent-facing documents (skills, AGENTS.md/CLAUDE.md, rules files), plus provenance tracking that compares an adapted skill to its pinned upstream and flags behavioral drift or fabricated attributions.
        developerName: Jacob Hoehler
        category: Developer Tools
        capabilities: [Read, Write]
        defaultPrompt: [Review this adapted skill against its upstream source.]
