schema: agentforge.package/v1
id: librarian
defaults: {"name": "librarian", "version": "0.21.1", "description": "Curates, catalogs, retrieves, and maintains your library of notes and knowledge in an Obsidian vault. Workflow-shaped (Capture / Process / Retrieve / Maintain) and agent-mediated (skills draft, agents execute). 19 skills + 4 agents + 6 references, coupled to the vault conventions in ~/Loose Ends/.claude/rules/{wiki.md,catalog.md} and the Templater templates in ~/Loose Ends/Templates/.", "author": {"name": "Jacob Hoehler"}, "license": "Apache-2.0", "keywords": ["obsidian", "knowledge-base", "wiki", "catalog", "notes", "meetings", "experiments", "bases", "ingest", "refresh", "lint", "curation", "personal-knowledge", "savings-goal", "budget", "purchase", "planning"]}
artifacts:
  - {type: skill, pattern: 'skills/*/SKILL.md'}
  - {type: agent, pattern: 'agents/*.md'}
payloads:
  include:
    - {source: references/}
    - {source: RUNTIME.md}
targets:
  claude:
    native:
      userConfig:
        word_log: {type: string, title: Word log, description: 'Vault-relative path of the note /term appends to on this machine', default: 'Reference/Word Log.md'}
  codex:
    codex-agent-bundle: true
    losses:
      - construct: agent-tools-filter
        state: stripped
        note: Codex role procedures carry no tool allowlist, so the vault agents' read-only and obsidian-cli-only restrictions are not enforced.
      - construct: mcp-tool-reference
        state: retained-unenforced
        note: Skills name mcp__obsidian-mcp__* tools that do not exist on Codex; the obsidian-cli paths in the same instructions are the portable route.
      - construct: body-agent-reference
        state: retained-unenforced
        note: >-
          Explicit setup registers exactly librarian:vault-reader,
          librarian:note-editor, librarian:vault-curator, and
          librarian:vault-inspector in one selected Codex scope. A fresh
          selected-scope check is required immediately before each exact
          dispatch. Generic body references are not rewritten or mechanically
          guarded by the compiler, and plugin installation alone still does
          not register a role; callers use a separately selected installed
          Markdown/procedure fallback without agent_type when registration is
          absent or stale.
      - construct: body-template-variable
        state: retained-unenforced
        note: >-
          Claude uses ${CLAUDE_PLUGIN_ROOT} for bundled references. Codex
          emits that text literally, so Codex callers must derive the active
          installed Librarian plugin root from the active skill path and pass
          its canonical absolute path in the agent's Runtime context. A role
          must not infer resources from its CWD, the authoring checkout, or a
          guessed cache path.
    native:
      interface:
        displayName: Librarian
        shortDescription: Curate and retrieve Obsidian knowledge
        longDescription: Capture, process, retrieve, and maintain notes through approval-gated workflows and isolated vault roles.
        developerName: Jacob Hoehler
        category: Productivity
        capabilities: [Read, Write, Interactive]
        defaultPrompt: [Search my knowledge base for this topic., Capture this as a structured note., Inspect my vault without changing anything.]
