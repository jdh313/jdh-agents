schema: agentforge.package/v1
id: librarian
defaults: {"name": "librarian", "version": "0.20.0", "description": "Curates, catalogs, retrieves, and maintains your library of notes and knowledge in an Obsidian vault. Workflow-shaped (Capture / Process / Retrieve / Maintain) and agent-mediated (skills draft, agents execute). 19 skills + 4 agents + 6 references, coupled to the vault conventions in ~/Loose Ends/.claude/rules/{wiki.md,catalog.md} and the Templater templates in ~/Loose Ends/Templates/.", "author": {"name": "Jacob Hoehler"}, "license": "Apache-2.0", "keywords": ["obsidian", "knowledge-base", "wiki", "catalog", "notes", "meetings", "experiments", "bases", "ingest", "refresh", "lint", "curation", "personal-knowledge", "savings-goal", "budget", "purchase", "planning"]}
artifacts:
  - {type: skill, pattern: 'skills/*/SKILL.md'}
  - {type: agent, pattern: 'agents/*.md'}
payloads:
  include:
    - {source: references/}
targets:
  claude:
    native:
      userConfig:
        word_log: {type: string, title: Word log, description: 'Vault-relative path of the note /term appends to on this machine', default: 'Reference/Word Log.md'}
  codex:
    losses:
      - construct: agent-tools-filter
        state: stripped
        note: Codex role procedures carry no tool allowlist, so the vault agents' read-only and obsidian-cli-only restrictions are not enforced.
      - construct: mcp-tool-reference
        state: retained-unenforced
        note: Skills name mcp__obsidian-mcp__* tools that do not exist on Codex; the obsidian-cli paths in the same instructions are the portable route.
      - construct: body-agent-reference
        state: retained-unenforced
        note: >-
          Codex registers no agent role from a plugin package, so the 72
          references to vault-reader, vault-curator, vault-inspector, and
          note-editor across librarian's own agent bodies, skill bodies, and
          references/architecture.md name a collaborator a Codex reader cannot
          dispatch. The dispatches are real on Claude -- registration,
          delegation, isolation, and model selection are observed -- so the
          bodies keep them and a Codex reader must perform the delegated vault
          work inline, without the read-only isolation the agent would have
          provided.
      - construct: body-template-variable
        state: retained-unenforced
        note: Vault agent and skill bodies interpolate ${CLAUDE_PLUGIN_ROOT} to locate bundled reference files. Codex emits the literal text unexpanded, so those paths do not resolve and a Codex reader must locate the references/ files by name instead.
    native:
      interface:
        displayName: Librarian
        shortDescription: Curate and retrieve Obsidian knowledge
        longDescription: Capture, process, retrieve, and maintain notes through approval-gated workflows and isolated vault roles.
        developerName: Jacob Hoehler
        category: Productivity
        capabilities: [Read, Write, Interactive]
        defaultPrompt: [Search my knowledge base for this topic., Capture this as a structured note., Inspect my vault without changing anything.]
