schema: agentforge.package/v1
id: penpot
defaults: {"name": "penpot", "version": "0.1.0", "description": "Drive Penpot through its MCP plugin without the silent failures: text edits that render stale until forced to re-layout, async page switching, suspended-tab hangs, and saving named versions before irreversible edits and after settled design decisions.", "author": {"name": "Jacob Hoehler"}, "license": "Apache-2.0", "keywords": ["penpot", "design", "mcp", "gotchas", "versioning"]}
artifacts:
  - {type: skill, pattern: 'skills/*/SKILL.md'}
targets:
  claude: {}
  codex:
    losses:
      - construct: mcp-tool-reference
        state: retained-unenforced
        note: >-
          The skill names the penpot MCP tools (mcp__penpot__execute_code,
          mcp__penpot__export_shape) and the Penpot plugin API they run. A Codex
          session without the Penpot MCP server connected cannot follow it; with
          one connected under different tool names, the gotchas still apply to
          whatever runs the same plugin-API calls.
    native:
      interface:
        displayName: Penpot
        shortDescription: Penpot MCP gotchas and versioning
        longDescription: Gotchas for driving Penpot through its MCP plugin (stale text rendering, async page switching, suspended tabs) and the rule to save named versions before irreversible edits and after settled design decisions.
        developerName: Jacob Hoehler
        category: Productivity
        capabilities: [Read, Write, Interactive]
        defaultPrompt: [Save a Penpot version for these changes.]
