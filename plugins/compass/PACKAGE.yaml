schema: agentforge.package/v1
id: compass
defaults: {"name": "compass", "version": "0.9.1", "description": "A suite of conversational thinking tools — reflect (Socratic mirror, never recommends, always saves), mull (thinking partner, probes AND contributes opinions, saves substantive sessions only), and converge (advisor, leads with a researched recommendation plus confidence % and refines it one question at a time).", "author": {"name": "Jacob Hoehler", "email": "jdhoehler@gmail.com"}, "license": "Apache-2.0", "keywords": ["reflection", "socratic", "decision", "journaling", "obsidian", "thinking-partner", "compass", "mull", "clarify", "converge", "recommendation", "advisor"]}
artifacts:
  - {type: skill, pattern: 'skills/*/SKILL.md'}
targets:
  claude: {}
  codex:
    native:
      interface:
        displayName: Compass
        shortDescription: Think a question through, three ways
        longDescription: Three explicit-invocation thinking stances — reflect mirrors without advising, mull contributes takes while staying question-led, and converge leads with a researched recommendation and a confidence number.
        developerName: Jacob Hoehler
        category: Productivity
        capabilities: [Read, Write, Interactive]
        defaultPrompt: [Help me think this through.]
