schema: agentforge.package/v1
id: compass
defaults: {"name": "compass", "version": "0.10.0", "description": "A suite of conversational thinking tools — reflect (Socratic mirror, never recommends, always saves), mull (thinking partner, probes AND contributes opinions, saves substantive sessions only), and converge (advisor, leads with a researched recommendation plus confidence % and refines it one question at a time). Plus a paired evaluation track: first-principles (evidence-first interview that produces a signed-off needs map before any option is named) hands off to solution-research (turns that map into a systems-first parallel-research handoff prompt).", "author": {"name": "Jacob Hoehler", "email": "accts@jdh.onl"}, "license": "Apache-2.0", "keywords": ["reflection", "socratic", "decision", "journaling", "obsidian", "thinking-partner", "compass", "mull", "clarify", "converge", "recommendation", "advisor", "requirements", "needs-map", "first-principles", "research", "evaluation", "handoff"]}
artifacts:
  - {type: skill, pattern: 'skills/*/SKILL.md'}
targets:
  claude: {}
  codex:
    native:
      interface:
        displayName: Compass
        shortDescription: Think a question through before deciding
        longDescription: Three explicit-invocation thinking stances — reflect mirrors without advising, mull contributes takes while staying question-led, and converge leads with a researched recommendation and a confidence number. Alongside them, first-principles interviews for evidence and locks a needs map, and solution-research turns that map into a systems-first research handoff prompt.
        developerName: Jacob Hoehler
        category: Productivity
        capabilities: [Read, Write, Interactive]
        defaultPrompt: [Help me think this through.]
