schema: agentforge.package/v1
id: introspect
defaults: {"name": "introspect", "version": "0.6.0", "description": "Introspection tooling for Claude Code itself. usage-report: reconstruct how a person works with Claude Code in a repo (skills, slash commands, subagents, MCP tools, task-kickoff style, activity over time) from their local session transcripts, via a stdlib-only read-only parser. Privacy-safe by default — names and counts only, no prompt text leaves the machine.", "author": {"name": "Jacob Hoehler"}, "license": "Apache-2.0", "keywords": ["claude-code", "introspection", "usage", "analytics", "transcripts", "workflow", "skills", "onboarding", "self-analysis"]}
artifacts:
  - {type: skill, pattern: 'skills/*/SKILL.md'}
targets:
  claude: {}
  codex:
    native:
      interface:
        displayName: Introspect
        shortDescription: Report on Claude Code usage patterns
        longDescription: Parses local Claude Code session transcripts under ~/.claude/projects/ to summarize skills, slash commands, subagents, MCP tools, and task-kickoff style. Read-only, stdlib-only, privacy-safe by default. Note — the analyzed transcripts are Claude Code's own; running this skill from Codex means it is inspecting a different runtime's logs than the one it's invoked from.
        developerName: Jacob Hoehler
        category: Developer Tools
        capabilities: [Read]
        defaultPrompt: [Summarize how I use Claude Code in this repo.]
