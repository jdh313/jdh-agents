schema: agentforge.package/v1
id: teach
defaults: {"name":"teach","version":"0.9.0","description":"A stateful, multi-session teaching workspace routed into the Obsidian vault. The /teach skill grounds learning in the user's documented learning style and high-trust sources, builds a mission, resources, glossary, and learning records as vault notes under the topic's best-fit context, and keeps lessons + cheat sheets as self-contained HTML. Grounds in owned textbooks via DEVONthink when available and pins live-code citations to immutable refs. Requires an Obsidian vault (obsidian-cli); optionally surfaces owned textbooks from DEVONthink. Adapted from mattpocock/skills (MIT, © 2026 Matt Pocock).","author":{"name":"Jacob Hoehler"},"license":"Apache-2.0","keywords":["teach","learn","education","lessons","spaced-repetition","productivity"]}
artifacts:
  - {type: skill, pattern: 'skills/*/SKILL.md'}
payloads:
  include:
    - source: skills/
      exclude: ['skills/*/SKILL.md', 'skills/*/scripts/**', 'skills/*/references/**', 'skills/*/assets/**']
targets:
  claude: {}
