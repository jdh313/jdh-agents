# OpenTelemetry Collector - Production Configuration
# Includes memory limiting, tail sampling, attribute processing, and multi-backend export

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Host metrics (CPU, memory, disk, network)
  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu:
      memory:
      disk:
      filesystem:
      network:

  # Prometheus scraper (if needed)
  prometheus:
    config:
      scrape_configs:
        - job_name: 'otel-collector'
          scrape_interval: 10s
          static_configs:
            - targets: ['localhost:8888']

processors:
  # Memory limiter (prevents OOM)
  memory_limiter:
    check_interval: 1s
    limit_mib: 2048
    spike_limit_mib: 512

  # Batch processor (reduces network overhead)
  batch:
    timeout: 10s
    send_batch_size: 1024

  # Resource processor (add/modify resource attributes)
  resource:
    attributes:
      - key: deployment.environment
        value: production
        action: upsert
      - key: service.namespace
        from_attribute: k8s.namespace.name
        action: insert

  # Attributes processor (add/modify span attributes)
  attributes:
    actions:
      # Remove PII
      - key: user.email
        action: delete
      - key: http.request.header.authorization
        action: delete

      # Redact credit card numbers
      - key: payment.card.number
        action: update
        value: "[REDACTED]"

  # Tail sampling (smart sampling after trace completes)
  tail_sampling:
    decision_wait: 10s
    num_traces: 100000
    expected_new_traces_per_sec: 1000
    policies:
      # Always sample errors
      - name: errors
        type: status_code
        status_code:
          status_codes: [ERROR]

      # Always sample slow requests (> 2s)
      - name: slow_requests
        type: latency
        latency:
          threshold_ms: 2000

      # Always sample critical endpoints
      - name: critical_endpoints
        type: string_attribute
        string_attribute:
          key: http.route
          values: [/checkout, /payment, /api/orders]

      # Sample 5% of everything else
      - name: baseline
        type: probabilistic
        probabilistic:
          sampling_percentage: 5

  # Filter processor (drop unwanted spans)
  filter:
    traces:
      span:
        # Drop health check spans
        - 'attributes["http.route"] == "/health"'
        - 'attributes["http.route"] == "/readiness"'

exporters:
  # OTLP exporter to Jaeger
  otlp/jaeger:
    endpoint: http://jaeger:4317
    tls:
      insecure: true

  # OTLP exporter to another collector or backend
  otlp/backend:
    endpoint: https://observability.example.com:4317
    tls:
      insecure: false
    headers:
      api-key: ${API_KEY}

  # Prometheus exporter for metrics
  prometheus:
    endpoint: 0.0.0.0:8889

  # Logging exporter (debugging)
  logging:
    loglevel: warn

service:
  # Collector metrics (for monitoring the collector itself)
  telemetry:
    logs:
      level: info
    metrics:
      address: 0.0.0.0:8888

  pipelines:
    traces:
      receivers: [otlp]
      processors:
        - memory_limiter
        - resource
        - attributes
        - filter
        - tail_sampling
        - batch
      exporters: [otlp/jaeger, otlp/backend]

    metrics:
      receivers: [otlp, hostmetrics, prometheus]
      processors:
        - memory_limiter
        - resource
        - batch
      exporters: [prometheus, otlp/backend]

    logs:
      receivers: [otlp]
      processors:
        - memory_limiter
        - resource
        - attributes
        - batch
      exporters: [otlp/backend]

  # Extensions (health checks, zpages)
  extensions: [health_check, pprof, zpages]

extensions:
  # Health check endpoint
  health_check:
    endpoint: 0.0.0.0:13133

  # pprof endpoint for profiling
  pprof:
    endpoint: 0.0.0.0:1777

  # zPages for debugging
  zpages:
    endpoint: 0.0.0.0:55679
