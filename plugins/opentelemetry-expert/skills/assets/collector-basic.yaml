# OpenTelemetry Collector - Basic Configuration
# Use this for local development or simple deployments

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  # Console exporter for debugging (prints to stdout)
  logging:
    loglevel: info

  # Jaeger exporter (if using Jaeger backend)
  otlp/jaeger:
    endpoint: http://jaeger:4317
    tls:
      insecure: true

  # Prometheus exporter for metrics (exposes /metrics endpoint)
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [logging, otlp/jaeger]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [logging, prometheus]

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [logging]
