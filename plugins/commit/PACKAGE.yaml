schema: agentforge.package/v1
id: commit
defaults: {"name": "commit", "version": "3.2.1", "description": "Format-aware atomic commits for git and jj (Jujutsu). One skill covering commit, split, message review, and retrofitting edits into earlier commits (jj absorb / git fixup). Auto-detects VCS and commit message style from repo context. Includes PreToolUse hook that blocks destructive working-copy operations.", "author": {"name": "Jacob Hoehler"}, "license": "Apache-2.0", "keywords": ["git", "jj", "jujutsu", "commits", "atomic", "absorb", "fixup", "conventional-commits", "freeform"]}
artifacts:
  - {type: skill, pattern: 'skills/*/SKILL.md'}
  - {type: hook, pattern: hooks/hooks.json}
targets:
  claude:
    payloads:
      include:
        - {source: hooks/destructive-vcs-guard.sh}
  codex:
    native:
      interface:
        displayName: Commit
        shortDescription: Create and organize atomic commits
        longDescription: Format-aware atomic commit workflows for Git and Jujutsu.
        developerName: Jacob Hoehler
        category: Developer Tools
        capabilities: [Read, Write]
        defaultPrompt: [Commit these changes atomically.]
