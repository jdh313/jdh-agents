schema: agentforge.package/v1
id: langfuse
defaults: {"name": "langfuse", "version": "1.4.0", "description": "Sends Claude Code and Codex session traces to Langfuse via a Stop hook — per-turn traces with prompts, generations, tool observations, and backdated timestamps. Includes a SessionStart tripwire that marks programmatically-spawned sessions.", "author": {"name": "Jacob Hoehler"}, "license": "Apache-2.0", "keywords": ["langfuse", "observability", "tracing", "llm", "monitoring"]}
artifacts:
  - {type: hook, pattern: hooks/hooks.json}
targets:
  claude:
    native:
      userConfig:
        LANGFUSE_SECRET_KEY: {type: string, title: Langfuse Secret Key, description: 'Your Langfuse project secret key (sk-lf-...)', sensitive: true, required: true}
        LANGFUSE_PUBLIC_KEY: {type: string, title: Langfuse Public Key, description: 'Your Langfuse project public key (pk-lf-...)', required: true}
        LANGFUSE_BASE_URL: {type: string, title: Langfuse Base URL, description: 'Langfuse host. Use https://us.cloud.langfuse.com for US, https://cloud.langfuse.com for EU, or your self-hosted URL.', default: 'https://us.cloud.langfuse.com'}
        CC_LANGFUSE_DEBUG: {type: boolean, title: Debug logging, description: 'Write verbose logs to ~/.claude/state/langfuse_hook.log', default: false}
    payloads:
      include:
        - {source: hooks/langfuse_hook.py}
        - {source: hooks/babysitter_spawn_tripwire.sh}
  codex:
    native:
      interface:
        displayName: Langfuse
        shortDescription: Trace Codex sessions in Langfuse
        longDescription: Sends per-turn Codex traces, generations, and tool observations to Langfuse after explicit hook review and trust.
        developerName: Jacob Hoehler
        category: Developer Tools
        capabilities: [Network]
        defaultPrompt: [Help me configure and verify Langfuse tracing.]
    payloads:
      include:
        - {source: hooks/langfuse_hook.py}
        - {source: hooks/babysitter_spawn_tripwire.sh}
