schema: agentforge.package/v1
id: teardown
defaults: {"name": "teardown", "version": "0.6.1", "description": "Study foreign open-source projects to extract transferable architectural lessons into the Obsidian vault. `/teardown` runs a study session over a local clone, or over files fetched at a pinned SHA when no clone exists, dispatching a read-only `surveyor` agent per project through two ordered phases (current structure, then history/rationale) descending one user-picked layer at a time (system map, domain model, code), spot-checking citations before any write, and adding each layer to an interactive Artifact page and to one of two note types: a single-concern QUESTION note that accretes comparison rows across projects over time, or a whole-system PROJECT note anchored on a mental model. Both carry `projects_surveyed:` frontmatter pinning the repo, commit SHA, and date read — the index and the read log in one place. `/teardown-recheck` audits that pin against the corpus's current HEAD, diffing cited files since the recorded SHA and verifying that cited line numbers still point at what the note claims, so drift is caught instead of trusted. A reference instrument for lookup, not a learning exercise. Composes with librarian (graduation, refresh) and ndr (decisions about the user's own projects); distinct from craft:grok, which studies repos the user owns and intends to change.", "author": {"name": "Jacob Hoehler"}, "license": "Apache-2.0", "keywords": ["teardown", "architecture", "open-source", "code-study", "oss", "obsidian", "research"]}
artifacts:
  - {type: skill, pattern: 'skills/*/SKILL.md'}
  - {type: agent, pattern: 'agents/*.md'}
payloads:
  include:
    - {source: references/}
targets:
  claude: {}
# Codex enrollment is deliberately withheld for 0.1.0. The package has a native
# mapping ready (an agent-tools-filter loss for the surveyor's read-only
# allowlist, and an mcp-tool-reference loss for the obsidian-mcp calls), but no
# projection has been exercised on a fresh Codex runtime. Enrolling before that
# would ship an unenforced read-only boundary on an agent that reads clones
# backing services the user runs. Restore the `codex:` block with those two
# declared losses once acceptance is done.
