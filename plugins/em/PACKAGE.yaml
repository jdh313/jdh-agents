schema: agentforge.package/v1
id: em
defaults: {"name": "em", "version": "0.1.0", "description": "Engineering-manager skills for executing tracked work, with no fixed lifecycle. `start` scopes one ticket (fetch, ground in decisions, read the touched code, ask only the questions nothing else can answer) and stops at a brief. `lead` takes any work reference, checks from the ticket body whether it is already shaped, picks an execution shape (inline, one worker, parallel workspaces, test-first), dispatches, and verifies every result by diff before a pre-push stop. Tracker-agnostic: Linear, Fibery, and GitHub Issues through per-tracker adapters, selected by the reference form or a repo-local `.em.toml`. Pairs with the pm plugin, which shapes the tickets em executes.", "author": {"name": "Jacob Hoehler"}, "license": "Apache-2.0", "keywords": ["engineering-manager", "orchestration", "delegation", "subagents", "verification", "tickets", "linear", "fibery", "github-issues"]}
artifacts:
  - {type: skill, pattern: 'skills/*/SKILL.md'}
payloads:
  include:
    - {source: references/}
# Claude only for now. `lead` is built on the Agent tool, AskUserQuestion, and
# Claude Code subagent names (junior-dev, senior-dev, the craft reviewers);
# enrolling Codex needs a native mapping and a fresh-runtime acceptance run
# first (ndr:v0a3bm).
targets:
  claude: {}
