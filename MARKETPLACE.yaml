schema: agentforge.marketplace/v1
id: jdh-agents
defaults:
  name: jdh-agents
  description: Personal dual-runtime plugin marketplace
  owner:
    name: Jacob Hoehler
    email: jacob@jdh.onl
packages:
  - plugins/*/PACKAGE.yaml
publications:
  - id: claude
    target: claude
    destination: .claude-plugin/marketplace.json
    # Publish a second copy of this registry at the repository root so
    # `/plugin marketplace add jdh313/jdh-agents` resolves remotely. Sources in
    # the root copy are rewritten to ./marketplaces/claude/plugins/<name>.
    root-manifest: true
    enrollment:
      mode: all-compatible
    native:
      metadata:
        description: Personal Claude Code plugin marketplace
        version: 1.0.0
  - id: codex
    target: codex
    destination: .agents/plugins/marketplace.json
    # Codex's git marketplace source reads the clone root, so publish a root
    # copy too; without it Codex falls back to the Claude root manifest and
    # installs the Claude publication. Sources are rewritten to
    # ./marketplaces/codex/plugins/<name>.
    root-manifest: true
    # A package's own `targets.codex` block is the single declaration of Codex
    # support. An explicit include list here would be a second copy of that
    # fact, and the compiler hard-errors when the two disagree.
    enrollment:
      mode: all-compatible
    native:
      interface:
        displayName: CC Marketplace
